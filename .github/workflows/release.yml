name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag matches crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag against Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "tag=$tag version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
            ext: ".exe"
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: false
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
            ext: ""

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Stage asset
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/ogma-tool${{ matrix.ext }}"
          dst="ogma-tool-${{ matrix.target }}${{ matrix.ext }}"
          cp "$src" "$dst"
          # Fail loudly if the artifact is missing or not runnable metadata-wise.
          ls -l "$dst"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ogma-tool-${{ matrix.target }}
          path: ogma-tool-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ogma-tool-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ogma-tool-*
          generate_release_notes: true
