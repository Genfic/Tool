version: "3"

tasks:
  start: cargo run --
  build: cargo build --release
  test: cargo test --locked
  check: cargo check --locked
  clippy: cargo clippy --all-targets --all-features -- -D warnings
  fmt: cargo fmt --all -- --check
  fmt-fix: cargo fmt --all
  release: cargo build --release
  install:
    deps:
      - release
    cmds:
      - cargo install --force --path .
  bundlesize: cargo run --release -- bundle-size "F:\\VS Projects\\Ogma3\\Ogma3\\wwwroot\\js\\dist\\**\\*.js" "F:\\VS Projects\\Ogma3\\Ogma3\\wwwroot\\js\\bundle\\**\\*.js"
  generate-imports: cargo run --release -- generate-imports "F:\\VS Projects\\Ogma3\\Ogma3\\wwwroot\\fonts" "fonts"
  generate-preloads: cargo run --release -- generate-preloads "F:\\VS Projects\\Ogma3\\Ogma3\\wwwroot\\fonts" "fonts"
  generate-paths: cargo run --release -- generate-paths "out" --verbose --cache --path.public="https://localhost:5001/openapi/public.json" --path.internal="https://localhost:5001/openapi/internal.json"
